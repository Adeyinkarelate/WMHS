    <marker id="arrowUp" markerWidth="10" markerHeight="10" refX="5" refY="1" orient="auto" markerUnits="strokeWidth">
      <path d="M0,9 L10,9 L5,0 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1280" height="1180" fill="url(#bg)"/>

  <text x="640" y="44" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">
    System Architecture
  </text>
  <text x="640" y="74" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">
    Web Maternal Health System (WMHS) - Nigeria
  </text>

  <g transform="translate(170, 100)">
    <rect width="420" height="58" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
