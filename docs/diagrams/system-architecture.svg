      <text x="128" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1d4ed8">Scores and notifications</text>
    </g>
    <g transform="translate(846, 86)">
      <rect width="256" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
      <text x="128" y="28" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Referrals and Facilities</text>
      <text x="128" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1d4ed8">Assignments and locations</text>
    </g>
  </g>

  <g transform="translate(70, 996)">
    <rect width="1140" height="72" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="28" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#64748b">DEPLOYMENT AND CROSS-CUTTING</text>
    <text x="28" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#334155">Vercel hosting  |  Neon PostgreSQL  |  Prisma ORM  |  NextAuth.js  |  Optional offline Python training</text>
  </g>

  <text x="640" y="1116" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">
