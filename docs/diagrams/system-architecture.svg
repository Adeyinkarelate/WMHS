      <text x="100" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0e7490">Patients and alerts</text>
      <text x="100" y="90" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0e7490">Referrals and facilities</text>
