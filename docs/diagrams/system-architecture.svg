    <rect x="36" y="18" width="72" height="26" rx="13" fill="#2563eb"/>
    <text x="72" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">LAYER 3</text>
    <text x="124" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Data Layer</text>
    <text x="256" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#2563eb">Prisma  |  Neon PostgreSQL</text>
    <text x="36" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Persistent storage for identity, maternal records, assessments, alerts, and referrals</text>

