      <text x="100" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0e7490">HTTP-only cookies</text>
      <text x="100" y="90" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0e7490">Role-based access</text>
    </g>
