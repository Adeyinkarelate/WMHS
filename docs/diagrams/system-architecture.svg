      <text x="128" y="28" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Maternal Records</text>
      <text x="128" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1d4ed8">Symptoms and test results</text>
    </g>
    <g transform="translate(576, 86)">
